name: Build and release Windows .exe

# Runs on every push to the repository's default branch (and can be started by hand
# from the Actions tab). Each run publishes a new release with AetherClash.exe attached.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'server/**'
      - 'aether_server.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pygame pyinstaller pillow

      - name: Smoke test
        run: python aether_clash.py --selftest
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Stamp the version
        shell: bash
        run: |
          echo "v0.1.${{ github.run_number }}" > version.txt
          echo "${{ vars.AETHER_SERVER }}" > server.txt

      - name: Draw the game icon
        run: python aether_clash.py --make-icon icon.png
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Build AetherClash.exe
        run: pyinstaller --onefile --windowed --name AetherClash --icon icon.png --add-data "assets;assets" --add-data "version.txt;." --add-data "server.txt;." aether_clash.py

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" dist/AetherClash.exe \
            --target "${{ github.sha }}" \
            --title "Aether Clash $TAG" \
            --notes "Automatic build of commit ${{ github.sha }}. Download AetherClash.exe below and double-click it to play (Windows). No Python needed." \
            --latest
